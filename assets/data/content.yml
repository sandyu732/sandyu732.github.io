# The trajectory / journey timeline shown on the landing page.
# Add as many entries as you want, in the order they should appear.
#
# Fields:
#   year        (required) e.g. 2025
#   month       (optional) e.g. May — use this when you have more than one
#               entry in the same year. You can repeat the same year as many
#               times as you like:
#
#                 - year: 2025
#                   month: May
#                   title: "Shipped the new pipeline"
#                   description: "What happened and why it mattered."
#                 - year: 2025
#                   month: October
#                   title: "Started a new role"
#                   description: "What changed."
#
#   title       (required) short milestone headline
#   description (required) a sentence or two of detail
